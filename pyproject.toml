[project]
name = "ralphthon-sample"
version = "0.1.0"
description = "야크 셰이빙 TUI. 간단한 개발 작업을 입력하면 실행 대신 선행 작업 3개가 늘어난다."
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
]

[project.scripts]
ralphthon-sample = "ralphthon_sample.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ralphthon_sample"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# Textual의 run_test()가 async context manager라 async 테스트가 필요하다.
# auto 모드를 쓰면 각 테스트에 @pytest.mark.asyncio를 붙이지 않아도 된다.
asyncio_mode = "auto"
testpaths = ["tests"]
